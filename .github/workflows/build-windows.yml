name: Gerar instalador do Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Setup_ARTY
          path: dist/Setup_ARTY.exe
          if-no-files-found: error
